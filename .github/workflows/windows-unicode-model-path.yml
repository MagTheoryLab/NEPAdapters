name: Windows Unicode model paths

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/windows-unicode-model-path.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "engines/**"
      - "frontends/python/**"
      - "include/**"
      - "pyproject.toml"
      - "src/**"
      - "tests/fixtures/cpu_baseline/**"
  pull_request:
    paths:
      - ".github/workflows/windows-unicode-model-path.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "engines/**"
      - "frontends/python/**"
      - "include/**"
      - "pyproject.toml"
      - "src/**"
      - "tests/fixtures/cpu_baseline/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-unicode-model-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel-regression:
    name: Build wheel and load Unicode paths
    runs-on: windows-2022
    env:
      NEP_CUDA: "0"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install wheel build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Windows CPU wheel
        run: python -m build --wheel --outdir .build/windows-unicode-wheel

      - name: Install built wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem .build/windows-unicode-wheel/*.whl |
            Select-Object -First 1
          if ($null -eq $wheel) {
            throw "Windows wheel was not produced"
          }
          python -m pip install --force-reinstall "$($wheel.FullName)"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run Unicode model-path regression
        run: python frontends/python/tests/test_unicode_model_paths.py
