[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "nep-adapters"
version = "1.0.1"
description = "NEP runtime adapters for Python and LAMMPS frontends"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "engines/cpu/native/LICENSE.NEP_CPU" }
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "numpy",
]

[project.optional-dependencies]
ase = [
  "ase",
]

[tool.scikit-build]
cmake.version = ">=3.24"
wheel.packages = ["frontends/python/nep_adapters"]

[tool.scikit-build.cmake.define]
BUILD_SHARED_LIBS = "OFF"
NEP_ADAPTERS_BUILD_TESTS = "OFF"
NEP_ADAPTERS_BUILD_BENCHMARKS = "OFF"
NEP_ADAPTERS_CUDA_ENABLE_QNEP_PPPM = "OFF"
NEP_ADAPTERS_CPU_ENABLE_OPENMP = "ON"
NEP_ADAPTERS_CPU_USE_RADIAL_TABLE = "OFF"
NEP_ADAPTERS_ENABLE_PYTHON = "ON"
NEP_ADAPTERS_ENABLE_LAMMPS = "OFF"
NEP_ADAPTERS_INSTALL_DEVELOPMENT_FILES = "OFF"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-manylinux_i686 *-win32"
build-verbosity = 1
test-command = "python {project}/frontends/python/tests/test_wheel_install.py"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair --wheel-dir {dest_dir} {wheel}"
